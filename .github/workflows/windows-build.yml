name: Windows build

# Windows builds run only by explicit manual dispatch, never on commit pushes.
on:
  workflow_dispatch:
    inputs:
      quality_checks:
        description: 'Run available Windows CPU/UI checks (full-disc checks reported as skipped)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out sources without historical release ZIPs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/downloads/

      - name: Check private input connection
        env:
          GAME_INPUTS_URL: ${{ secrets.GAME_INPUTS_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GAME_INPUTS_URL)) {
            throw 'Set the repository Actions secret GAME_INPUTS_URL before running this workflow. See docs/github-actions.md.'
          }

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Windows LLVM
        run: |
          choco install llvm --version=20.1.8 --yes --no-progress --allow-downgrade --force
          if ($LASTEXITCODE -ne 0) { throw 'LLVM installation failed.' }

      - name: Download and verify private compilation inputs
        env:
          GAME_INPUTS_URL: ${{ secrets.GAME_INPUTS_URL }}
          GAME_INPUTS_TOKEN: ${{ secrets.GAME_INPUTS_TOKEN }}
        run: python scripts/prepare-actions-inputs.py

      - name: Build Windows release with optional quality checks
        run: |
          $quality = '${{ inputs.quality_checks }}' -eq 'true'
          ./scripts/build-windows.ps1 -PreparedInputs assets/actions-inputs -Jobs 4 -SkipTests -QualityChecks:$quality

      - name: Upload quality-check summaries
        if: always() && inputs.quality_checks
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Windows-quality-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/windows-validation/**/results.json
            out/windows-validation/**/runtime-sha256.json
          if-no-files-found: warn
          retention-days: 7

      - name: Package application
        id: package
        run: |
          $title = (git log -1 --format=%s).Trim()
          $title = [regex]::Replace($title, '[<>:"/\\|?*\x00-\x1F\x7F]', '-')
          $title = $title.Trim().TrimEnd('.')
          if ($title.Length -gt 100) { $title = $title.Substring(0, 100).Trim().TrimEnd('.') }
          if (!$title) { $title = 'Windows build' }
          "title=$title" >> $env:GITHUB_OUTPUT
          $sdk = Get-Content sdk-version.json -Raw | ConvertFrom-Json
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $archive = "MotoGP0910-Windows-x64-$shortSha-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.zip"
          python scripts/package-windows.py --build-dir out/build/win-amd64-release --sdk-root "out/sdk-$($sdk.version)/win-amd64" --archive $archive

      - name: Upload downloadable Windows ZIP
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: MotoGP0910-Windows-x64 - ${{ steps.package.outputs.title }}
          path: out/package-windows/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Remove private inputs
        if: always()
        run: |
          foreach ($folder in @('assets/actions-inputs', 'assets/game-tu')) {
            if (Test-Path -LiteralPath $folder) {
              Remove-Item -LiteralPath $folder -Recurse -Force
            }
          }
